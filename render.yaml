# Use this file as the Blueprint when this project is the repository root.
services:
  - type: web
    name: june-events-ng
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /founder
        destination: /founder/index.html
      - type: rewrite
        source: /services
        destination: /services/index.html
      - type: rewrite
        source: /tattoo
        destination: /tattoo/index.html
      - type: rewrite
        source: /nails
        destination: /nails/index.html
      - type: rewrite
        source: /gallery
        destination: /gallery/index.html
      - type: rewrite
        source: /testimonials
        destination: /testimonials/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /*
        destination: /index.html
